syntax = "proto3";

option csharp_namespace = "Auth.Api";

package role;

service RoleService {
  rpc CreateRole (CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole (UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole (DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GetRole (GetRoleRequest) returns (GetRoleResponse);
  rpc PaginationRole (PaginationRoleRequest) returns (PaginationRoleResponse);
}

service PermissionService {
  rpc GetPermission (GetPermissionRequest) returns (GetPermissionResponse);
  rpc PaginationPermission (PaginationPermissionRequest) returns (PaginationPermissionResponse);
}

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc PaginationUser (PaginationUserRequest) returns (PaginationUserResponse);
}

message CreateRoleRequest {
  string name = 1;
  repeated int32 permissions = 2;
}

message CreateRoleResponse {
  int32 id = 1;
}

message UpdateRoleRequest {
  int32 id = 1;
  string name = 2;
  repeated int32 permissions = 3;
}

message UpdateRoleResponse {
  int32 id = 1;
}

message DeleteRoleRequest {
  int32 id = 1;
}

message DeleteRoleResponse {
  int32 id = 1;
}

message GetRoleRequest {
  int32 id = 1;
}

message GetRoleResponse {
  int32 id = 1;
  string name = 2;
  repeated int32 permissions = 3;
}

message PaginationRoleRequest {
  int32 page = 1;
  int32 count = 2;
  string name_search = 3;
}

message PaginationRoleResponse {
  repeated GetRoleResponse items = 1;
}

message GetPermissionRequest {
  int32 id = 1;
}

message GetPermissionResponse {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message PaginationPermissionRequest {
  int32 page = 1;
  int32 count = 2;
  string name_search = 3;
}

message PaginationPermissionResponse {
  repeated GetPermissionResponse items = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  int32 role = 3;
}

message CreateUserResponse {
  int32 id = 1;
}

message UpdateUserRequest {
  int32 id = 1;
  string username = 2;
  string passwordhash = 3;
  int32 role = 4;
}

message UpdateUserResponse {
  int32 id = 1;
}

message DeleteUserRequest {
  int32 id = 1;
}

message DeleteUserResponse {
  int32 id = 1;
}

message GetUserRequest {
  int32 id = 1;
}

message GetUserResponse {
  int32 id = 1;
  string username = 2;
  int32 role = 3;
}

message PaginationUserRequest {
  int32 page = 1;
  int32 count = 2;
  string login_search = 3;
}

message PaginationUserResponse {
  repeated GetUserResponse items = 1;
}
