# Поднять всё: docker compose up -d --build
# Только инфраструктуру: docker compose -f infra/docker-compose.yml up -d
include:
  - infra/docker-compose.yml

services:
  math-api:
    build:
      context: .
      dockerfile: src/Services/CoreService/Math.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=math_db;Username=postgres;Password=123
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      Jwt__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
    ports: ["7088:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # auth-service: добавим сюда же, когда перенесём AuthService
