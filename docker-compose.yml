# Поднять всё: docker compose up -d --build
# Только инфраструктуру: docker compose -f infra/docker-compose.yml up -d
# Секреты берутся из .env в корне (не коммитится): JWT_SECRET_KEY, SEED_ADMIN_PASSWORD
include:
  - infra/docker-compose.yml

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Redis: redis:6379
  RabbitMq__Host: rabbitmq
  Jwt__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}

services:
  auth-api:
    build:
      context: .
      dockerfile: src/Services/AuthService/Auth.Api/Dockerfile
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=auth_math_db;Username=postgres;Password=123
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
    ports: ["5262:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  math-api:
    build:
      context: .
      dockerfile: src/Services/CoreService/Math.Api/Dockerfile
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=math_db;Username=postgres;Password=123
    ports: ["5151:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-api: { condition: service_started }
