# Поднять всё: docker compose up -d --build
# Только инфраструктуру: docker compose -f infra/docker-compose.yml up -d
#
# Секреты (Jwt:SecretKey, Seed:AdminPassword) здесь не хранятся и .env не нужен —
# они берутся из dotnet user-secrets, так же как при запуске из VS.
# Папка user-secrets с Windows монтируется в контейнер (только чтение),
# а в Development ASP.NET Core сам читает secrets.json по UserSecretsId из csproj.
include:
  - infra/docker-compose.yml

x-service: &service
  volumes:
    - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Redis: redis:6379
  RabbitMq__Host: rabbitmq

services:
  auth-api:
    <<: *service
    build:
      context: .
      dockerfile: src/Services/AuthService/Auth.Api/Dockerfile
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=auth_math_db;Username=postgres;Password=123
    ports: ["5262:8080"]

  math-api:
    <<: *service
    build:
      context: .
      dockerfile: src/Services/CoreService/Math.Api/Dockerfile
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=math_db;Username=postgres;Password=123
    ports: ["5151:8080"]

  streaming-api:
    <<: *service
    build:
      context: .
      dockerfile: src/Services/StreamingService/Streaming.Api/Dockerfile
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=streaming_db;Username=postgres;Password=123
      MediaMtx__ApiUrl: http://mediamtx:9997
      MediaMtx__PublicUrl: http://localhost:8889
    ports: ["5080:8080"]
