# Общая инфраструктура для ВСЕХ микросервисов.
# Поднимается один раз, сервисы подключаются к сети lms-net.
#   docker compose -f infra/docker-compose.yml up -d
name: lms-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    # 5433 снаружи — чтобы не конфликтовать с локально установленным PostgreSQL на 5432.
    # У каждого сервиса своя БД (auth_math_db, math_db, streaming_db) — EF создаёт её при миграции.
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # API Gateway: http://localhost:8080/api/auth/... и /api/core/...
  # Проксирует на host.docker.internal:5262 (Auth) и :5151 (Math) —
  # работает и когда сервисы запущены из VS, и когда в docker (порты те же).
  gateway:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Медиасервер для стриминга: WebRTC (WHIP публикация / WHEP просмотр), HLS, запись
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    ports:
      - "9997:9997"     # control API
      - "8889:8889"     # WebRTC
      - "8888:8888"     # HLS
      - "8189:8189/udp" # WebRTC ICE

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  recordings:

networks:
  default:
    name: lms-net
